version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: suvi_postgres
    restart: always
    environment:
      POSTGRES_USER: suvi_user
      POSTGRES_PASSWORD: suvi_password
      POSTGRES_DB: suvi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suvi_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://suvi_user:suvi_password@db:5432/suvi_db
      SECRET_KEY: suvi-luxury-jewellery-secret-key-2026-cormorant-garamond
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suvi_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
